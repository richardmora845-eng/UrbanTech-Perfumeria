       CATÁLOGO

    .products-grid {
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
      gap:22px;
    }

    .product-card {
      position:relative;
      overflow:hidden;
      cursor:pointer;
    }

    .product-image {
      position:relative;
      width:100%;
      height:280px;
      display:flex;
      align-items:center;
      justify-content:center;
      overflow:hidden;
    }

    .product-image img {
      width:100%;
      height:100%;
      object-fit:contain;
      padding:15px;
      box-sizing:border-box;
    }
